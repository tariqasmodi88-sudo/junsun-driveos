name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      - name: Compila APK debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug :sniffer:assembleDebug 2>&1 | tee -a build.log

      - name: Riepilogo errori
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|FAILED|AssertionError|expected:<|What went wrong" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Errori di build::$MSG"
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | head -5 | while read f; do
            F=$(grep -A3 "<failure" "$f" | head -12 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Test fallito $(basename $f)::$F"
          done

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: DriveOS-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            sniffer/build/outputs/apk/debug/sniffer-debug.apk

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriveOS.apk
          cp sniffer/build/outputs/apk/debug/sniffer-debug.apk Sniffer.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DriveOS.apk Sniffer.apk \
            --title "DriveOS build ${{ github.run_number }}" \
            --notes "Compilazione automatica del commit ${{ github.sha }}. APK debug per uso personale." \
            --latest
