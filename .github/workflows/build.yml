name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compila APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: DriveOS-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriveOS.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DriveOS.apk \
            --title "DriveOS build ${{ github.run_number }}" \
            --notes "Compilazione automatica del commit ${{ github.sha }}. APK debug per uso personale." \
            --latest
