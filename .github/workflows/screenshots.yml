name: Anteprime schermate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Genera le immagini
        env:
          DRIVEOS_SHOTS: "1"
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*ScreenshotTest*' > /tmp/gradle.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprime
          path: |
            app/build/screenshots/*.png
            app/build/reports/tests/testDebugUnitTest/**
      - name: Salva le immagini nel branch anteprime
        if: always()
        run: |
          mkdir -p /tmp/out && cp app/build/screenshots/*.png /tmp/out/ || true
          tail -150 /tmp/gradle.log > /tmp/out/log.txt
          cat app/build/test-results/testDebugUnitTest/*Screenshot*.xml 2>/dev/null | head -c 6000 > /tmp/out/result.xml || true
          git config user.name "anteprime"; git config user.email "anteprime@users.noreply.github.com"
          git checkout --orphan anteprime
          git rm -rf . -q
          cp /tmp/out/* .
          git add .
          git commit -m "anteprime" -q
          git push -f origin anteprime
