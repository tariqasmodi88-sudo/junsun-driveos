name: Anteprime schermate

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Genera le immagini
        env:
          DRIVEOS_SHOTS: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*ScreenshotTest*' 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprime
          path: |
            app/build/screenshots/*.png
            app/build/reports/tests/testDebugUnitTest/**
